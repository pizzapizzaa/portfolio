<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triangle Spaceship</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    @keyframes pulse-glow { 0%,100%{ opacity:.6 } 50%{ opacity:1 } }
    @keyframes drift { 0%{ transform:translateY(0) } 50%{ transform:translateY(-12px) } 100%{ transform:translateY(0) } }
    @keyframes star-twinkle { 0%,100%{ opacity:.2 } 50%{ opacity:.8 } }
    .ship { animation: drift 3s ease-in-out infinite; }
    .engine-glow { animation: pulse-glow 1.2s ease-in-out infinite; }
    .star { animation: star-twinkle 2s ease-in-out infinite; }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full m-0">
  <div id="app" class="h-full w-full flex flex-col items-center justify-center overflow-auto" style="background: radial-gradient(ellipse at 50% 30%, #0f1b3d 0%, #070d1f 60%, #020408 100%); font-family: 'Orbitron', sans-serif;">
   <svg viewbox="0 0 400 450" xmlns="http://www.w3.org/2000/svg" style="max-width:380px; width:80%;" class="ship">
    <defs>
     <lineargradient id="hull" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b0c4de" />
      <stop offset="50%" stop-color="#4a6a8a" />
      <stop offset="100%" stop-color="#1c2e44" />
     </lineargradient>
     <lineargradient id="accent" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4fd1f9" />
      <stop offset="100%" stop-color="#1565a0" />
     </lineargradient>
     <radialgradient id="cockpit-g" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#a0ecff" />
      <stop offset="60%" stop-color="#2bb5e0" />
      <stop offset="100%" stop-color="#0a4f6d" />
     </radialgradient>
     <lineargradient id="flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff4a3" />
      <stop offset="30%" stop-color="#ff8c00" />
      <stop offset="70%" stop-color="#ff3500" />
      <stop offset="100%" stop-color="#ff350000" />
     </lineargradient>
     <filter id="glow">
      <fegaussianblur stddeviation="6" result="b" />
      <femerge>
       <femergenode in="b" />
       <femergenode in="SourceGraphic" />
      </femerge>
     </filter>
     <filter id="flame-blur">
      <fegaussianblur stddeviation="4" />
     </filter>
    </defs> <!-- stars --> <circle class="star" cx="30" cy="40" r="1.2" fill="#fff" style="animation-delay:0s" /> <circle class="star" cx="370" cy="70" r="1" fill="#fff" style="animation-delay:.7s" /> <circle class="star" cx="90" cy="20" r="0.8" fill="#fff" style="animation-delay:1.2s" /> <circle class="star" cx="310" cy="15" r="1.1" fill="#fff" style="animation-delay:.3s" /> <circle class="star" cx="55" cy="110" r="0.9" fill="#fff" style="animation-delay:1.5s" /> <circle class="star" cx="345" cy="140" r="1" fill="#fff" style="animation-delay:.9s" /> <circle class="star" cx="150" cy="8" r="0.7" fill="#fff" style="animation-delay:1.8s" /> <circle class="star" cx="260" cy="30" r="1.3" fill="#fff" style="animation-delay:.4s" /> <!-- engine flames --> <g class="engine-glow" filter="url(#flame-blur)">
     <ellipse cx="175" cy="345" rx="10" ry="40" fill="url(#flame)" opacity=".9" />
     <ellipse cx="200" cy="350" rx="12" ry="55" fill="url(#flame)" opacity=".85" />
     <ellipse cx="225" cy="345" rx="10" ry="40" fill="url(#flame)" opacity=".9" />
    </g> <!-- wing struts --> <polygon points="200,100 120,310 145,310" fill="#2a3e56" stroke="#3a6080" stroke-width="0.5" /> <polygon points="200,100 280,310 255,310" fill="#2a3e56" stroke="#3a6080" stroke-width="0.5" /> <!-- main hull --> <polygon points="200,60 140,320 260,320" fill="url(#hull)" stroke="#5a8aaa" stroke-width="1.5" stroke-linejoin="round" /> <!-- panel lines --> <line x1="200" y1="100" x2="165" y2="280" stroke="#5a8aaa" stroke-width="0.6" opacity=".5" /> <line x1="200" y1="100" x2="235" y2="280" stroke="#5a8aaa" stroke-width="0.6" opacity=".5" /> <line x1="170" y1="230" x2="230" y2="230" stroke="#5a8aaa" stroke-width="0.5" opacity=".4" /> <!-- accent stripes --> <polygon points="200,80 185,150 200,145 215,150" fill="url(#accent)" opacity=".7" /> <!-- cockpit --> <ellipse cx="200" cy="155" rx="18" ry="28" fill="url(#cockpit-g)" stroke="#4fd1f9" stroke-width="1.2" filter="url(#glow)" /> <!-- engine nozzles --> <rect x="168" y="315" width="14" height="14" rx="2" fill="#1c2e44" stroke="#4fd1f9" stroke-width="0.8" /> <rect x="193" y="315" width="14" height="16" rx="2" fill="#1c2e44" stroke="#4fd1f9" stroke-width="0.8" /> <rect x="218" y="315" width="14" height="14" rx="2" fill="#1c2e44" stroke="#4fd1f9" stroke-width="0.8" /> <!-- wingtip lights --> <circle cx="142" cy="315" r="3" fill="#ff3030" filter="url(#glow)" class="engine-glow" /> <circle cx="258" cy="315" r="3" fill="#30ff50" filter="url(#glow)" class="engine-glow" style="animation-delay:.6s" />
   </svg>
  </div>
  <script>
const defaultConfig = {
  heading_text: "Triangle Spaceship",
  background_color: "#070d1f",
  accent_color: "#4fd1f9",
  hull_color: "#4a6a8a",
  text_color: "#4fd1f9",
  font_family: "Orbitron",
  font_size: 28
};

function applyConfig(c) {
  const h = document.getElementById("heading");
  h.textContent = c.heading_text || defaultConfig.heading_text;
  const sz = c.font_size || defaultConfig.font_size;
  h.style.fontSize = sz + "px";
  const clr = c.text_color || defaultConfig.text_color;
  h.style.color = clr;
  h.style.textShadow = `0 0 18px ${clr}80`;
  const ff = c.font_family || defaultConfig.font_family;
  h.style.fontFamily = `${ff}, Orbitron, sans-serif`;
  const bg = c.background_color || defaultConfig.background_color;
  document.getElementById("app").style.background = `radial-gradient(ellipse at 50% 30%, ${bg}cc 0%, ${bg} 60%, #020408 100%)`;
}

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => applyConfig(config),
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: v => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); }},
      { get: () => config.text_color || defaultConfig.text_color, set: v => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); }}
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: v => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }},
    fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: v => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); }}
  }),
  mapToEditPanelValues: (config) => new Map([
    ["heading_text", config.heading_text || defaultConfig.heading_text]
  ])
});
</script>
